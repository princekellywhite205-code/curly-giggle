<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mia’s Birthday</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
margin: 0; padding: 0; width: 100%; height: 100%;
font-family: 'Great Vibes', cursive;
overflow: hidden;
display: flex; justify-content: center; align-items: center;
background-color: #0a0a0a;
color: #fff;
}

/* PAGE 1 - Gift Box */
#boxContainer {
display: flex; flex-direction: column;
justify-content: center; align-items: center;
}

#box {
width: 150px; height: 150px;
background: linear-gradient(145deg, #333, #111);
display: flex; justify-content: center; align-items: center;
border-radius: 20px;
font-size: 50px;
cursor: pointer;
box-shadow: 0 0 20px #fff;
}

#clickMe {
margin-top: 30px; padding: 15px 30px;
background-color: #222;
border: 2px solid #fff;
border-radius: 12px;
color: #fff;
font-size: 18px;
cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s;
}

#clickMe:hover {
transform: scale(1.1);
box-shadow: 0 0 15px gold;
}

@keyframes shake {
0% { transform: translateX(0); }
20% { transform: translateX(-10px); }
40% { transform: translateX(10px); }
60% { transform: translateX(-10px); }
80% { transform: translateX(10px); }
100% { transform: translateX(0); }
}

/* PAGE 2 - Celebration */
#celebration {
display: none;
position: absolute;
width: 100%; height: 100%;
background-color: #0a0a0a;
text-align: center;
}

#birthdayText {
position: absolute;
top: 20%;
width: 100%;
font-size: 60px;
color: #c0c0c0;
text-shadow: 0 0 15px #fff, 0 0 30px #ffd700;
}

/* Container for images + roses */
#imageContainer {
display: none;
position: absolute;
top: 50%;
left: 50%;
transform: translate(-50%, -50%);
display: flex;
gap: 20px;
}

.imageWrapper {
position: relative;
}

/* Image entrance animation */
.imageEnter {
opacity: 0;
transform: translateY(-100px) rotate(-15deg);
animation: enterAnim 0.8s forwards;
animation-fill-mode: forwards;
}

@keyframes enterAnim {
0% { opacity: 0; transform: translateY(-100px) rotate(-15deg); }
50% { opacity: 1; transform: translateY(20px) rotate(10deg); }
70% { transform: translateY(-10px) rotate(-5deg); }
100% { opacity: 1; transform: translateY(0) rotate(0deg); }
}

#imageContainer img {
width: 200px;
height: auto;
border-radius: 15px;
box-shadow: 0 0 15px #fff;
}

/* Rose effect */
.rose {
position: absolute;
top: -50px;
left: 50%;
width: 30px;
height: 30px;
background: radial-gradient(circle at 50% 50%, #ff4d4d 0%, #b30000 70%);
border-radius: 50%;
transform: translateX(-50%) scale(0);
animation: bloom 1s forwards;
animation-fill-mode: forwards;
}

@keyframes bloom {
0% { transform: translateX(-50%) scale(0); opacity: 0; }
50% { transform: translateX(-50%) scale(1.2); opacity: 1; }
100% { transform: translateX(-50%) scale(1); opacity: 1; }
}

/* Confetti */
.confetti {
position: absolute;
width: 8px; height: 8px;
opacity: 0.9;
pointer-events: none;
border-radius: 50%;
}
</style>
</head>
<body>

<!-- PAGE 1 -->
<div id="boxContainer">
<div id="box">🎁</div>
<button id="clickMe">Click Me</button>
</div>

<!-- PAGE 2 -->
<div id="celebration">
<div id="birthdayText">Happy 18th Birthday Mia!</div>

<!-- Two images in center with rose -->
<div id="imageContainer">
<div class="imageWrapper">
<div class="rose"></div>
<img src="Mia.jpeg" alt="Mia 1" class="imageEnter">
</div>
<div class="imageWrapper">
<div class="rose"></div>
<img src="mia2.png" alt="Mia 2" class="imageEnter">
</div>
</div>

<!-- Audio autoplay (hidden) and loop -->
<audio id="birthdayAudio" src="bb.mp3" autoplay loop></audio>
</div>

<script>
const clickMeBtn = document.getElementById('clickMe');
const box = document.getElementById('box');
const boxContainer = document.getElementById('boxContainer');
const celebration = document.getElementById('celebration');
const imageContainer = document.getElementById('imageContainer');
const roses = document.querySelectorAll('.rose');
const birthdayAudio = document.getElementById('birthdayAudio');

clickMeBtn.addEventListener('click', () => {
box.style.animation = 'shake 0.5s';
box.addEventListener('animationend', () => {
boxContainer.style.display = 'none';
celebration.style.display = 'block';
startConfetti();

// Play audio when page 2 opens
birthdayAudio.play().catch(() => {
console.log('Autoplay blocked by browser, user interaction needed.');
});

// Show images + roses after confetti starts
setTimeout(() => {
imageContainer.style.display = 'flex';
roses.forEach((rose, i) => {
setTimeout(() => { rose.style.animationPlayState = 'running'; }, i * 300);
});
}, 800);
}, { once: true });
});

// Confetti
function startConfetti() {
const colors = ['#c0c0c0', '#ffd700', '#fff'];
for (let i = 0; i < 200; i++) {
const confetti = document.createElement('div');
confetti.classList.add('confetti');
confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
confetti.style.left = Math.random() * window.innerWidth + 'px';
confetti.style.top = Math.random() * -window.innerHeight + 'px';
confetti.style.width = Math.random() * 10 + 5 + 'px';
confetti.style.height = confetti.style.width;
confetti.style.opacity = Math.random() * 0.8 + 0.2;
document.body.appendChild(confetti);
animateConfetti(confetti);
}
}

function animateConfetti(confetti) {
let top = parseFloat(confetti.style.top);
let left = parseFloat(confetti.style.left);
const speed = Math.random() * 3 + 2;
const swing = Math.random() * 2 - 1;
const rotationSpeed = Math.random() * 10;

function fall() {
top += speed;
left += swing;
confetti.style.top = top + 'px';
confetti.style.left = left + 'px';
confetti.style.transform = `rotate(${rotationSpeed + top}deg)`;
if (top < window.innerHeight) requestAnimationFrame(fall);
else confetti.remove();
}
fall();
}
</script>

</body>
</html>
